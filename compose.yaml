# CodeTrain ローカル開発環境
#
# 設計: Document/LOCAL_DEV.md §4
#   * Go（api / migrate）は**ローカルでも必ずコンテナ**
#   * admin(Next.js) は **compose に含めない**。WSL ホストで `make dev-admin`
#   * ポートは 0.0.0.0 にバインドする（127.0.0.1: を付けると Windows 側から届かない）
#
# **profiles は使わない。** 素の docker compose コマンドだけで操作できることを優先する。
# profile を絞ると依存先（postgres 等）まで「未定義」になり、depends_on が壊れる。
# `docker compose up -d` だけで、初期化（マイグレーション・シード・Ministack）まで完了する。
#
# Track A（pipeline / llm-proxy / sandbox-runner）は profile ではなく別ファイルにする。
# 着手時に compose.lab.yaml を追加し、次のように重ねる:
#   docker compose -f compose.yaml -f compose.lab.yaml up -d
# こうすると pipeline を持っていない人の `docker compose up -d` は Track B だけを起動する
# （LOCAL_DEV.md §3 の「Track B は Track A なしで完結する」を profile なしで保つ）。
#
# build context は隣のリポジトリを相対パスで指す（REPOSITORIES.md §2.2）。

name: codetrain

services:
  # ---------------------------------------------------------------------------
  # 土台
  # ---------------------------------------------------------------------------

  postgres:
    # 本番の Aurora Serverless v2 (PostgreSQL) とメジャーバージョンを揃える。
    # Aurora 固有機能は使わない（LOCAL_DEV.md §4.2）。
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codetrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codetrain}
      POSTGRES_DB: ${POSTGRES_DB:-codetrain}
      # ログを日本語ロケールに引きずられないようにする
      LANG: C.UTF-8
    ports:
      # ホスト側のポートは .env で変更できる。Windows 側に別の PostgreSQL が
      # 動いているとき 5432 は衝突する（LOCAL_DEV.md §11）。
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codetrain} -d ${POSTGRES_DB:-codetrain}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  ministack:
    # LocalStack ではなく Ministack（MIT / 単一ポート 4566）。LOCAL_DEV.md §1。
    image: ministackorg/ministack:${MINISTACK_VERSION:-1.5}
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    environment:
      # S3 は既定で揮発する（S3_PERSIST=0）。コンテナを作り直すたびに
      # アップロード済みオブジェクトが消えると開発の邪魔になるため永続化する。
      # Cognito 側に相当する設定は無く、User Pool ID はコンテナ再作成で変わる
      # （そのため aws-init が up のたびに走り直す）。
      S3_PERSIST: "1"
      S3_DATA_DIR: /data/s3
    volumes:
      - ministack:/data
    healthcheck:
      # イメージに curl / wget は無いので busybox の wget を使う。
      # 接続先は 127.0.0.1。localhost だと ::1 を先に引いて接続に失敗する。
      test: ["CMD-SHELL", "busybox wget -q -O - http://127.0.0.1:4566/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # ---------------------------------------------------------------------------
  # 初期化（ワンショット。up のたびに走り、終わったら exit 0 で消える）
  # どちらも冪等なので、何度実行しても同じ状態に収束する。
  # ---------------------------------------------------------------------------

  # Ministack 上のリソース（S3 バケット・Cognito User Pool / App Client / テストユーザー）
  # を作る。IaC（codetrain-infra）は本番専用と割り切り、ローカルはここに寄せる。
  aws-init:
    image: amazon/aws-cli:${AWS_CLI_VERSION:-2.32.9}
    # 既定の entrypoint は aws 本体なので、スクリプトを実行するよう上書きする。
    entrypoint: ["/bin/bash", "/scripts/bootstrap-ministack.sh"]
    restart: "no"
    # ホストユーザーで動かす。root のままだと .generated/cognito.env が root 所有になり、
    # ホスト側から消せなくなる。UID/GID が 1000 でない環境は .env で上書きする。
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://ministack:4566}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy}
      AWS_PAGER: ""
      S3_BUCKET: ${S3_BUCKET:-codetrain-local}
      COGNITO_TEST_PASSWORD: ${COGNITO_TEST_PASSWORD:-CodeTrain#Local1}
    volumes:
      - ./scripts:/scripts:ro
      # Cognito の ID を .generated/cognito.env に書き出す（AUTH_MODE=cognito で使う）
      - ./.generated:/out
    depends_on:
      ministack:
        condition: service_healthy

  # マイグレーションとシード投入の実行主体。
  # 「core 以外がスキーマを変更しない」という規律をローカルでも守るため、
  # api からではなく必ずこのサービス経由で流す（LOCAL_DEV.md §10.2）。
  #
  # 既定コマンドは seed（内部で up を実行してからシードを流す）。
  # 個別に叩きたいときは:
  #   docker compose run --rm db-init up
  #   docker compose run --rm db-init down 1
  #   docker compose run --rm db-init redo      # up → down -all → up の往復検証
  #   docker compose run --rm db-init version
  db-init:
    build:
      context: ../codetrain-core
      dockerfile: Dockerfile.migrate
    image: codetrain/migrator:dev
    command: ["seed"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://codetrain:codetrain@postgres:5432/codetrain?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # アプリケーション
  # ---------------------------------------------------------------------------

  api:
    build:
      context: ../codetrain-api
      dockerfile: Dockerfile.dev
    image: codetrain/api:dev
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://codetrain:codetrain@postgres:5432/codetrain?sslmode=disable}
      AUTH_MODE: ${AUTH_MODE:-dev}
      COGNITO_JWKS_URL: ${COGNITO_JWKS_URL:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # AWS SDK にはエンドポイントとダミー資格情報を環境変数で与える。
      # アプリコードにエミュレータ分岐は書かない（LOCAL_DEV.md §4.2）。
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://ministack:4566}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy}
      S3_BUCKET: ${S3_BUCKET:-codetrain-local}
      # private module（codetrain-core）取得用。今は replace で隣を指しているため未使用。
      GOPRIVATE: ${GOPRIVATE:-github.com/gabaison-2026-09/*}
      GOFLAGS: -buildvcs=false
    volumes:
      - ../codetrain-api:/workspace/codetrain-api
      # core を **同じ相対関係で** マウントする。api の go.mod にある
      # `replace ... => ../codetrain-core` をコンテナ内でも成立させるため。
      - ../codetrain-core:/workspace/codetrain-core:ro
      # module / ビルドキャッシュを永続化しないと、コンテナを作り直すたびに
      # go mod download からやり直しになる（LOCAL_DEV.md §4.2）。
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    working_dir: /workspace/codetrain-api
    depends_on:
      postgres:
        condition: service_healthy
      # 初期化が終わってから起動する。これにより `docker compose up -d` の直後に
      # /v1/skills がシードを返せる状態になっている。
      db-init:
        condition: service_completed_successfully
      aws-init:
        condition: service_completed_successfully

  # DB 閲覧用。軽量（~5MB）なので profile で出し入れせず常駐させる。
  adminer:
    image: adminer:5
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ministack:
  gomodcache:
  gobuildcache:
