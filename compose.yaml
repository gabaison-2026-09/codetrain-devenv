# CodeTrain ローカル開発環境
#
# 設計: Document/LOCAL_DEV.md §4
#   * profiles でトラックを切り替える（core / product / lab / tools）
#   * Go（api / pipeline / migrate）は**ローカルでも必ずコンテナ**
#   * admin(Next.js) は **compose に含めない**。WSL ホストで `make dev-admin`
#   * ポートは 0.0.0.0 にバインドする（127.0.0.1: を付けると Windows 側から届かない）
#
# build context は隣のリポジトリを相対パスで指す（REPOSITORIES.md §2.2）。
# 全リポジトリを揃える必要はない。profile で起動対象が絞られる。

name: codetrain

services:
  # ---------------------------------------------------------------------------
  # core profile — 両トラック共通の土台
  # ---------------------------------------------------------------------------

  postgres:
    # 本番の Aurora Serverless v2 (PostgreSQL) とメジャーバージョンを揃える。
    # Aurora 固有機能は使わない（LOCAL_DEV.md §4.2）。
    image: postgres:${POSTGRES_VERSION:-16}
    # manual を含めているのは、migrate サービス（profile: manual）が
    # depends_on で postgres を参照するため。同じ profile に居ないと解決できない。
    profiles: ["core", "product", "lab", "all", "manual"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codetrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codetrain}
      POSTGRES_DB: ${POSTGRES_DB:-codetrain}
      # ログを日本語ロケールに引きずられないようにする
      LANG: C.UTF-8
    ports:
      # ホスト側のポートは .env で変更できる。Windows 側に別の PostgreSQL が
      # 動いているとき 5432 は衝突する（LOCAL_DEV.md §11）。
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codetrain} -d ${POSTGRES_DB:-codetrain}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  ministack:
    # LocalStack ではなく Ministack（MIT / 単一ポート 4566）。LOCAL_DEV.md §1。
    image: ministackorg/ministack:${MINISTACK_VERSION:-1.5}
    profiles: ["core", "product", "lab", "all"]
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    environment:
      # S3 は既定で揮発する（S3_PERSIST=0）。コンテナを作り直すたびに
      # アップロード済みオブジェクトが消えると開発の邪魔になるため永続化する。
      # Cognito 側に相当する設定は無く、User Pool ID はコンテナ再作成で変わる
      # （そのため make up-core は毎回 bootstrap-ministack.sh を流し直す）。
      S3_PERSIST: "1"
      S3_DATA_DIR: /data/s3
    volumes:
      - ministack:/data
    healthcheck:
      # イメージに curl / wget は無いので busybox の wget を使う。
      # 接続先は 127.0.0.1。localhost だと ::1 を先に引いて接続に失敗する。
      test: ["CMD-SHELL", "busybox wget -q -O - http://127.0.0.1:4566/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # マイグレーションとシード投入の実行主体。
  # 「core 以外がスキーマを変更しない」という規律をローカルでも守るため、
  # api からではなく必ずこのサービス経由で流す（LOCAL_DEV.md §10.2）。
  #
  # profile を manual にしてあるので up では起動せず、make migrate / make seed から
  # `docker compose run --rm migrate <cmd>` として使う。
  migrate:
    build:
      context: ../codetrain-core
      dockerfile: Dockerfile.migrate
    image: codetrain/migrator:dev
    profiles: ["manual"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://codetrain:codetrain@postgres:5432/codetrain?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # product profile — Track B
  # ---------------------------------------------------------------------------

  api:
    build:
      context: ../codetrain-api
      dockerfile: Dockerfile.dev
    image: codetrain/api:dev
    profiles: ["product", "all"]
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://codetrain:codetrain@postgres:5432/codetrain?sslmode=disable}
      AUTH_MODE: ${AUTH_MODE:-dev}
      COGNITO_JWKS_URL: ${COGNITO_JWKS_URL:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # AWS SDK にはエンドポイントとダミー資格情報を環境変数で与える。
      # アプリコードにエミュレータ分岐は書かない（LOCAL_DEV.md §4.2）。
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://ministack:4566}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy}
      S3_BUCKET: ${S3_BUCKET:-codetrain-local}
      # private module（codetrain-core）取得用。今は replace で隣を指しているため未使用。
      GOPRIVATE: ${GOPRIVATE:-github.com/gabaison-2026-09/*}
      GOFLAGS: -buildvcs=false
    volumes:
      - ../codetrain-api:/workspace/codetrain-api
      # core を **同じ相対関係で** マウントする。api の go.mod にある
      # `replace ... => ../codetrain-core` をコンテナ内でも成立させるため。
      - ../codetrain-core:/workspace/codetrain-core:ro
      # module / ビルドキャッシュを永続化しないと、コンテナを作り直すたびに
      # go mod download からやり直しになる（LOCAL_DEV.md §4.2）。
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    working_dir: /workspace/codetrain-api
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_started

  # ---------------------------------------------------------------------------
  # tools profile — 補助
  # ---------------------------------------------------------------------------

  adminer:
    image: adminer:5
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # lab profile（Track A）は pipeline リポジトリ着手時に追加する。
  #   pipeline / llm-proxy / sandbox-runner — LOCAL_DEV.md §6・§7
  # ---------------------------------------------------------------------------

volumes:
  pgdata:
  ministack:
  gomodcache:
  gobuildcache:
